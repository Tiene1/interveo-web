# Sert l'export statique de Next.js (dossier out/). Les pages sont des fichiers
# `nom.html` : /connexion renvoie connexion.html, /interventions/detail renvoie
# interventions/detail.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers fingerprintes par Next.js : cache long sans risque.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
