name: CI

# Verifie chaque push et chaque pull request : types, lint, tests et build de
# production. Ne deploie rien : Vercel redeploie de son cote a chaque push sur
# `main` (cf. docs/architecture.md).
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # L'adresse de l'API est integree au code a la compilation (export
      # statique) ; une valeur factice suffit pour verifier que le build passe.
      - name: Build de production
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.invalide.example
