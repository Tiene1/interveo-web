<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>W5 v4 — Photo en plein écran · SIM</title>
<meta name="viewport" content="width=1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --brand:#2563EB; --ink-1:#0F172A; --text-soft:#475569; --text-weak:#94A3B8;
    --line:#E2E8F0; --paper:#FBFBF9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink-1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}

  .canvas{padding:48px 24px 80px;display:flex;flex-direction:column;align-items:center;gap:32px}
  .canvas-header{width:100%;max-width:1392px;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px dashed var(--line)}
  .canvas-header h1{margin:0;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:.08em;text-transform:uppercase}
  .canvas-header .meta{font-size:12px;color:var(--text-weak);letter-spacing:.02em}
  .variant-label{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.16em;margin-bottom:14px;padding-left:2px}
  .variant-label .dot{width:5px;height:5px;border-radius:1px;background:#0F172A}

  .lightbox{
    width:1440px;height:900px;
    background:#0A0E1A;
    border-radius:2px;
    overflow:hidden;
    position:relative;
    display:flex;flex-direction:column;
  }

  /* Top strip */
  .top-strip{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 32px;
    color:rgba(255,255,255,.75);
    font-size:11px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;
    z-index:2;
  }
  .top-strip .ref{
    display:flex;align-items:center;gap:12px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
  }
  .top-strip .ref .hash{color:rgba(255,255,255,.5)}
  .top-strip .ref .num{color:#fff;font-weight:600}
  .top-strip .ref .sep{color:rgba(255,255,255,.3);margin:0 4px}
  .close-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:transparent;border:1px solid rgba(255,255,255,.15);
    color:#fff;
    padding:8px 12px 8px 14px;
    border-radius:4px;
    font:inherit;font-size:11px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .close-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25)}
  .close-btn svg{width:14px;height:14px;stroke-width:1.75}
  .close-btn .kbd{
    padding:1px 5px;
    background:rgba(255,255,255,.1);
    border-radius:3px;
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    margin-left:2px;
  }

  /* Photo area */
  .photo-area{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    padding:32px 100px 60px;
  }
  .photo{
    width:auto;
    max-width:100%;
    max-height:600px;
    aspect-ratio:4 / 3;
    height:600px;
    background:#0F172A;
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.4);
  }
  .photo .fill{
    position:absolute;inset:0;
    background:repeating-linear-gradient(45deg, #1E293B 0 12px, #253248 12px 24px);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.15);
  }
  .photo .fill svg{width:80px;height:80px;stroke-width:1}

  /* Navigation chevrons */
  .nav-btn{
    position:absolute;
    top:50%;transform:translateY(-50%);
    width:44px;height:44px;
    background:transparent;
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25)}
  .nav-btn svg{width:20px;height:20px;stroke-width:1.5}
  .nav-btn.prev{left:32px}
  .nav-btn.next{right:32px}

  /* Bottom caption */
  .caption{
    padding:24px 32px 32px;
    color:rgba(255,255,255,.9);
    display:flex;align-items:flex-end;justify-content:space-between;gap:32px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .caption-main{
    display:flex;flex-direction:column;gap:6px;
  }
  .caption-kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:500;
    color:rgba(255,255,255,.5);
    letter-spacing:.08em;
  }
  .caption-title{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-variation-settings:"SOFT" 30, "WONK" 0;
    font-size:22px;font-weight:400;
    letter-spacing:-.02em;line-height:1.15;
    color:#fff;margin:0;
  }
  .caption-title .em{font-style:italic}
  .caption-meta{
    font-size:12px;color:rgba(255,255,255,.55);
    letter-spacing:.02em;
    display:flex;align-items:center;gap:12px;
  }
  .caption-meta .sep{color:rgba(255,255,255,.25)}
  .caption-meta strong{color:rgba(255,255,255,.85);font-weight:500}
  .caption-right{
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  }
  .indicator{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:500;
    color:rgba(255,255,255,.7);
    letter-spacing:.06em;
    display:flex;align-items:center;gap:8px;
  }
  .indicator .divider{color:rgba(255,255,255,.3)}
  .indicator .current{color:#fff;font-weight:600}
  .thumbs{
    display:flex;gap:6px;
    padding:6px 0 0;
  }
  .thumb{
    width:48px;height:36px;
    background:rgba(255,255,255,.06);
    border:1px solid transparent;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.25);
  }
  .thumb.active{border-color:rgba(255,255,255,.8)}
  .thumb svg{width:14px;height:14px;stroke-width:1.5}

  /* Keyboard hints */
  .kbd-hints{
    position:absolute;
    bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;color:rgba(255,255,255,.4);
    letter-spacing:.06em;
    z-index:2;
    pointer-events:none;
  }
  .kbd-hints .k{
    padding:2px 6px;background:rgba(255,255,255,.08);border-radius:3px;color:rgba(255,255,255,.7);
  }
</style>
</head>
<body>
  <main class="canvas" data-screen-label="W5v4 Photo plein ecran">
    <header class="canvas-header">
      <h1>W5 · v4 · Photo en plein écran</h1>
      <span class="meta">Visionneuse éditoriale</span>
    </header>

    <section style="display:flex;flex-direction:column;align-items:center">
      <div style="width:1440px"><div class="variant-label"><span class="dot"></span>État : visionneuse plein écran</div></div>

      <div class="lightbox">

        <div class="top-strip">
          <div class="ref">
            <span><span class="hash">#</span><span class="num">0135</span></span>
            <span class="sep">·</span>
            <span>Pharmacie Saint Jean</span>
          </div>
          <button class="close-btn" type="button">
            Fermer
            <i data-lucide="x"></i>
            <span class="kbd">Esc</span>
          </button>
        </div>

        <div class="photo-area">
          <button class="nav-btn prev" aria-label="Photo précédente">
            <i data-lucide="chevron-left"></i>
          </button>

          <div class="photo">
            <div class="fill">
              <i data-lucide="image"></i>
            </div>
          </div>

          <button class="nav-btn next" aria-label="Photo suivante">
            <i data-lucide="chevron-right"></i>
          </button>
        </div>

        <div class="caption">
          <div class="caption-main">
            <div class="caption-kicker">AVANT · 12/09/2026 · 09:15</div>
            <h1 class="caption-title">Climatiseur split <span class="em">avant</span> intervention</h1>
            <div class="caption-meta">
              <span>Photographiée par <strong>Awa Traoré</strong></span>
              <span class="sep">·</span>
              <span>Rue des Jardins, II Plateaux</span>
            </div>
          </div>
          <div class="caption-right">
            <div class="indicator">
              <span class="current">01</span>
              <span class="divider">/</span>
              <span>02</span>
            </div>
            <div class="thumbs">
              <div class="thumb active"><i data-lucide="image"></i></div>
              <div class="thumb"><i data-lucide="image"></i></div>
            </div>
          </div>
        </div>

        <div class="kbd-hints">
          <span><span class="k">←</span> précédent</span>
          <span><span class="k">→</span> suivant</span>
          <span><span class="k">Esc</span> fermer</span>
        </div>

      </div>
    </section>
  </main>

<script>
  if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
